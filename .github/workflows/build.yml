name: Sync SuperJinX to My Project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout my repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Clone source repo
        run: |
          set -e
          SRC_DIR="/tmp/superjinx-src"
          rm -rf "$SRC_DIR"
          git clone --depth 1 https://github.com/x4gpanell/SuperJinX.git "$SRC_DIR"

      - name: Copy files (excluding .git, README.md, *.svg)
        run: |
          set -e

          # 1) حذف .git مخزن مبدأ (حیاتی برای push)
          rm -rf /tmp/superjinx-src/.git

          # 2) حذف فایل‌های ناخواسته از مخزن مبدأ
          rm -f /tmp/superjinx-src/README.md
          find /tmp/superjinx-src -type f -name '*.svg' -delete

          # 3) پاک‌سازی محتوای پروژه به جز .git و .github
          find . -mindepth 1 -maxdepth 1 \
            ! -name '.git' \
            ! -name '.github' \
            -exec rm -rf {} +

          # 4) کپی محتوای مبدأ به پروژه
          cp -r /tmp/superjinx-src/. .

          # 5) نمایش وضعیت برای اطمینان
          git status --short | head -20

      - name: Configure git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Commit & Push
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "چیزی برای کامیت نیست."
          else
            git commit -m "Upload Project Files"
            git push
          fi
